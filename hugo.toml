baseURL = "https://splunk.github.io/splunk-show-docs/"
title = "Splunk Show Documentation"
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true
defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1

[module]
  [module.hugoVersion]
    extended = true
    min = "0.161.1"
  [[module.imports]]
    path = "github.com/splunk/hugo-theme-splunk-workshop"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[params]
  brandName = "splunk>"
  brandTagline = ""
  description = "A comprehensive user guide for using the Splunk Show platform."
  copyright = "&copy; {year} Splunk LLC All rights reserved."
  logoLight = "images/splunkshowlogo-dark.png"
  logoDark = "images/splunkshowlogo-light.png"
  logoHeight = "40"

  defaultMode = "auto"
  showThemeToggle = true

  colorAccent = "#FF007F"
  colorAccent2 = "#FF9000"
  colorAccent3 = "#FFAB0F"
  colorAccentDark = "#D4006B"
  colorAccentText = "#BD0D5F"
  colorAccentTextDark = "#FF7DBA"

  colorInk = "#0C1724"
  colorInkMuted = "#585B61"
  colorPaper = "#FFFFFF"
  colorSurface = "#F4F6FA"
  colorSurfaceAlt = "#E9EDF2"
  colorBorder = "#E1E5EC"
  colorBorderStrong = "#C7CDD8"

  colorInkDark = "#F4F1EA"
  colorInkMutedDark = "#9CA3AF"
  colorPaperDark = "#0C1724"
  colorSurfaceDark = "#141E2F"
  colorSurfaceAltDark = "#1B2740"
  colorBorderDark = "#1F2C44"
  colorBorderStrongDark = "#2A3A56"

  splunkDataSansPro = true
  fontUrl = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  fontDisplay = "'Splunk Data Sans Pro', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fontBody = "'Splunk Data Sans Pro', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fontMono = "'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"

  showSidebar = true
  showToc = true
  showProgress = true
  showLightTrails = true
  contentMaxWidth = "720px"

  heroBackgroundLight = "images/background_Splunk-light.png"
  heroBackgroundDark  = "images/background_Splunk-dark.png"

  editURL = ""
  repoURL = ""

  [params.social]
    github = ""
    twitter = ""
    linkedin = ""
    youtube = ""
