name: Validate Hugo Build

on:
  pull_request:
    branches: ["main"]

env:
  HUGO_VERSION: "0.141.0"
  NODE_VERSION: "22"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Validate build
        run: hugo --minify --printPathWarnings --printUnusedTemplates
