name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.141.0"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install -g axios node-html-markdown
      - name: Fetch release notes
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          NODE_PATH: /usr/local/lib/node_modules
        run: node scripts/fetch-release-notes.js
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-raw
          path: files/release_notes.md

  process-release-notes:
    runs-on: ubuntu-latest
    needs: fetch-release-notes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download raw release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-raw
          path: files/
      - name: Process release notes
        run: node scripts/process-release-notes.js
      - name: Upload processed content
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-content
          path: content/release-notes/

  build:
    runs-on: ubuntu-latest
    needs: process-release-notes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Download processed release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-content
          path: content/release-notes/
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_PARAMS_assetVersion: ${{ github.sha }}
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
